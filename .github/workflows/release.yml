name: Release

# Builds the package and publishes a GitHub release when a version tag is pushed.
# It does NOT publish to PyPI; that is still a manual `twine upload` of the
# artifacts attached to the release.

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    # The repository default for GITHUB_TOKEN is read-only; creating a release needs write.
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Check the tag matches the package version
      run: |
        version=$(python - <<'PY'
        import tomllib
        print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])
        PY
        )
        if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
          echo "::error::Tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${version}"
          exit 1
        fi

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: |
        python -m build
        twine check dist/*

    - name: Create GitHub release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # A release may already have been created by hand; leave it untouched so
        # its attached files stay identical to what was uploaded to PyPI.
        if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
          echo "Release ${GITHUB_REF_NAME} already exists; nothing to do."
          exit 0
        fi
        # Use this version's section of CHANGELOG.md as the notes, if there is one.
        awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## " v "$" {f=1; next} /^## /{f=0} f' CHANGELOG.md > notes.md
        if [ -s notes.md ]; then
          gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --notes-file notes.md
        else
          gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --generate-notes
        fi
